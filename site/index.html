<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Restoran Buyurtma</title>
<meta name="robots" content="noindex, nofollow">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1b5e20">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bestellungen">
<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="header-bar">
    <div class="top-row">
      <div class="brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2v6a2 2 0 0 0 2 2h0a2 2 0 0 0 2-2V2M8 10v12M18 2c-2 2-2 5-2 7a2 2 0 0 0 2 2v10"/></svg>
        <h1 data-i18n="title"></h1>
      </div>
      <div class="top-actions">
        <div class="lang-switch">
          <button class="icon-btn" onclick="toggleLangMenu()" id="lang-btn" aria-label="Language">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 4 5.7 4 9s-1.5 6.5-4 9c-2.5-2.5-4-5.7-4-9s1.5-6.5 4-9Z"/></svg>
          </button>
          <div id="lang-menu" class="lang-menu" style="display:none">
            <button onclick="setLang('de')" id="btn-de">Deutsch</button>
            <button onclick="setLang('en')" id="btn-en">English</button>
            <button onclick="setLang('it')" id="btn-it">Italiano</button>
          </div>
        </div>
        <button id="chef-btn" class="chef-btn" onclick="onChefButton()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M9 21v-4h6v4M6.5 8.5A3.5 3.5 0 0 1 10 5a2.5 2.5 0 0 1 4 0 3.5 3.5 0 0 1 3.5 3.5c0 1.6-1 3-2.5 3.4V15h-6v-3.1c-1.5-.4-2.5-1.8-2.5-3.4Z"/></svg>
          <span id="chef-btn-label" data-i18n="chefLogin"></span>
        </button>
      </div>
    </div>
  </div>

  <div id="offline-banner" class="offline-banner" style="display:none" data-i18n="offlineBanner"></div>
  <div id="chef-note-banner" class="chef-note-banner" style="display:none"></div>

  <div class="tabs">
    <button class="tab-btn active" onclick="showTab('catalog')" data-tab="catalog">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      <span data-i18n="tabCatalog"></span>
    </button>
    <button class="tab-btn" onclick="showTab('basket')" data-tab="basket">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7L6 8ZM9 8a3 3 0 0 1 6 0"/></svg>
      <span data-i18n="tabBasket"></span>
    </button>
    <button class="tab-btn" onclick="showTab('delivery')" data-tab="delivery">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 16V6h11v10M14 9h4l3 3v4h-2M14 16h6M6 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4ZM17 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"/></svg>
      <span data-i18n="tabDelivery"></span>
    </button>
    <button class="tab-btn" onclick="showTab('calendar')" data-tab="calendar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span data-i18n="tabCalendar"></span>
    </button>
    <button class="tab-btn" onclick="showTab('notes')" data-tab="notes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11l3 3v13H5V4Z"/><path d="M16 4v3h3M8 11h8M8 15h5"/></svg>
      <span data-i18n="tabNotes"></span>
    </button>
    <button class="tab-btn" onclick="showTab('report')" data-tab="report">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M11 20V4M18 20v-7"/></svg>
      <span data-i18n="tabReport"></span>
    </button>
    <button class="tab-btn" onclick="showTab('documents')" data-tab="documents">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/></svg>
      <span data-i18n="tabDocuments"></span>
    </button>
  </div>

  <!-- CATALOG -->
  <div id="view-catalog" class="view">
    <input type="text" id="employeeName" class="employee-input">
    <div id="loading-products" data-i18n="loading"></div>
    <div class="card" id="catalogCard">
      <div class="chef-only-inline" id="manageProductsRow" style="display:none">
        <span data-i18n="manageProducts"></span>
        <button class="plus-btn" onclick="toggleAddProduct()" aria-label="+">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
      <div id="catalogList"></div>
    </div>
    <button class="submit-btn" onclick="submitToBasket()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7L6 8ZM9 8a3 3 0 0 1 6 0"/></svg>
      <span data-i18n="addToBasket"></span>
    </button>
    <div id="catalogMessage" class="msg"></div>

    <div id="addProductBox" class="chef-only-box" style="display:none">
      <h3>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        <span data-i18n="addProductTitle"></span>
      </h3>
      <input type="text" id="newProdDe" data-i18n-placeholder="nameDe" class="field">
      <input type="text" id="newProdEn" data-i18n-placeholder="nameEn" class="field">
      <input type="text" id="newProdIt" data-i18n-placeholder="nameIt" class="field">
      <input type="text" id="newProdUnit" data-i18n-placeholder="unit" class="field">
      <select id="newProdCategory" class="field" onchange="onCategorySelectChange()"></select>
      <input type="text" id="newProdCategoryCustom" data-i18n-placeholder="newCategoryName" class="field" style="display:none">
      <input type="number" step="0.01" min="0" id="newProdPrice" data-i18n-placeholder="price" class="field">
      <input type="text" id="newProdSupplier" data-i18n-placeholder="supplier" class="field">
      <button class="submit-btn secondary-btn" onclick="submitProduct()"><span data-i18n="addProductBtn"></span></button>
      <div id="addProductMessage" class="msg"></div>
    </div>
  </div>

  <!-- BASKET -->
  <div id="view-basket" class="view" style="display:none">
    <div class="card"><div id="basketList"></div></div>
    <button id="finalizeBtn" class="submit-btn chef-only-box" style="display:none" onclick="finalizeOrder()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      <span data-i18n="finalizeBtn"></span>
    </button>
    <div id="basketMessage" class="msg"></div>
  </div>

  <!-- DELIVERY -->
  <div id="view-delivery" class="view" style="display:none">
    <h3 id="deliveryDateLabel"></h3>
    <div class="card"><div id="deliveryList"></div></div>
  </div>

  <!-- CALENDAR -->
  <div id="view-calendar" class="view" style="display:none">
    <input type="date" id="calendarDate" class="field" onchange="loadCalendarDate()">
    <div class="card"><div id="calendarList"></div></div>
  </div>

  <!-- NOTES -->
  <div id="view-notes" class="view" style="display:none">
    <textarea id="noteText" class="field" rows="2" data-i18n-placeholder="notePlaceholder"></textarea>
    <input type="date" id="noteDate" class="field">
    <label class="chef-only-box" id="chefNoteLabelWrap" style="display:none">
      <input type="checkbox" id="noteIsChef"> <span data-i18n="markChefNote"></span>
    </label>
    <button class="submit-btn" onclick="submitNote()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      <span data-i18n="addNoteBtn"></span>
    </button>
    <div class="card"><div id="notesList"></div></div>
  </div>

  <!-- REPORT -->
  <div id="view-report" class="view" style="display:none">
    <div class="report-toolbar">
      <input type="month" id="reportMonth" class="field" onchange="loadReport()">
      <button class="icon-btn dark" onclick="window.print()" aria-label="Print">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6M6 18H4a1 1 0 0 1-1-1v-5a1 1 0 0 1 1-1h16a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1h-2M6 14h12v7H6v-7Z"/></svg>
      </button>
    </div>
    <div class="card" id="reportPrintArea">
      <div id="reportSummary"></div>
      <div id="reportProducts"></div>
      <div id="reportExpenses"></div>
    </div>

    <div id="reportShareRow" class="chef-only-inline" style="display:none">
      <span data-i18n="saveAndSend"></span>
      <div class="row-actions">
        <button class="plus-btn" onclick="exportReportToDocs()" aria-label="save">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/></svg>
        </button>
        <button class="plus-btn" onclick="toggleEmailReport()" aria-label="email">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16v12H4z"/><path d="m4 7 8 6 8-6"/></svg>
        </button>
      </div>
    </div>
    <div id="emailReportBox" class="chef-only-box" style="display:none">
      <input type="email" id="reportEmailTo" data-i18n-placeholder="accountantEmail" class="field">
      <button class="submit-btn secondary-btn" onclick="submitEmailReport()" data-i18n="sendEmailBtn"></button>
      <div id="emailReportMessage" class="msg"></div>
    </div>
    <div id="reportShareLinks" style="display:none"></div>

    <div id="addExpenseRow" class="chef-only-inline" style="display:none">
      <span data-i18n="manageExpenses"></span>
      <button class="plus-btn" onclick="toggleAddExpense()" aria-label="+">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
    <div id="addExpenseBox" class="chef-only-box" style="display:none">
      <input type="text" id="newExpenseDesc" data-i18n-placeholder="expenseDesc" class="field">
      <input type="number" step="0.01" min="0" id="newExpenseAmount" data-i18n-placeholder="expenseAmount" class="field">
      <input type="date" id="newExpenseDate" class="field">
      <button class="submit-btn secondary-btn" onclick="submitExpense()" data-i18n="addExpenseBtn"></button>
      <div id="addExpenseMessage" class="msg"></div>
    </div>
  </div>

  <!-- DOCUMENTS -->
  <div id="view-documents" class="view" style="display:none">
    <div class="card" id="monthlyReportsCard" style="display:none">
      <div class="report-section-title" data-i18n="monthlyReports"></div>
      <div id="monthlyReportsList"></div>
    </div>

    <div class="card">
      <div class="report-section-title" data-i18n="uploadDocTitle"></div>
      <input type="text" id="docDescription" data-i18n-placeholder="docDescription" class="field">
      <input type="date" id="docDate" class="field">
      <label class="upload-label" for="docFileInput">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4M7 9l5-5 5 5M12 4v13"/></svg>
        <span id="docFileLabel" data-i18n="chooseOrPhoto"></span>
      </label>
      <input type="file" id="docFileInput" accept="image/*" capture="environment" style="display:none" onchange="onDocFileChosen()">
      <button class="submit-btn" onclick="submitDocument()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        <span data-i18n="uploadBtn"></span>
      </button>
      <div id="docMessage" class="msg"></div>
    </div>

    <div class="card"><div id="documentsList"></div></div>
  </div>

<script src="app.js"></script>
</body>
</html>
